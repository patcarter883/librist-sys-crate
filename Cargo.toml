[package]
name = "librist-sys"
version = "0.1.0"
edition = "2021"
links = "rist"
description = "FFI bindings for librist - Reliable Internet Stream Transport protocol library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/librist-sys"
rust-version = "1.64"

[build-dependencies]
pkg-config = "0.3"

[dependencies]
thiserror = { version = "1.0", optional = true }

[features]
default = ["std"]
std = ["thiserror"]
no_std = []
safe-wrappers = ["std"]
bindgen = []
static = []

[profile.release]
opt-level = 3
lto = true